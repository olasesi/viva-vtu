apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: auth-service
  namespace: viva-vtu
  labels:
    app: auth-service
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "30"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - api.vivavtu.com
      secretName: api-tls
  rules:
    - host: api.vivavtu.com
      http:
        paths:
          - path: /api/auth
            pathType: Prefix
            backend:
              service:
                name: auth-service
                port:
                  number: 3001
          - path: /api-docs
            pathType: Prefix
            backend:
              service:
                name: auth-service
                port:
                  number: 3001