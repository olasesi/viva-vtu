apiVersion: v1
kind: Secret
metadata:
  name: auth-service-secrets
  namespace: viva-vtu
  labels:
    app: auth-service
    component: secrets
type: Opaque
stringData:
  DATABASE_URL: "mysql://viva:REPLACE_ME@mysql:3306/viva_vtu_auth"
  JWT_ACCESS_SECRET: "REPLACE_ME_ACCESS"
  JWT_REFRESH_SECRET: "REPLACE_ME_REFRESH"
  REDIS_PASSWORD: "REPLACE_ME_REDIS"
  SMTP_USER: "REPLACE_ME"
  SMTP_PASS: "REPLACE_ME"
  SENTRY_DSN: ""