apiVersion: v1
kind: ConfigMap
metadata:
  name: auth-service-config
  namespace: viva-vtu
  labels:
    app: auth-service
    component: config
data:
  NODE_ENV: "production"
  PORT: "3001"
  FRONTEND_URL: "https://app.vivavtu.com"
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  SMTP_HOST: "smtp.mailtrap.io"
  SMTP_PORT: "587"
  MAIL_FROM: "noreply@vivavtu.com"
  LOG_LEVEL: "info"
  SENTRY_TRACES_SAMPLE_RATE: "0.1"