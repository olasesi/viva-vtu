apiVersion: batch/v1
kind: Job
metadata:
  name: auth-service-migrate
  namespace: viva-vtu
  labels:
    app: auth-service
    component: migration
spec:
  template:
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
      containers:
        - name: migrate
          image: ghcr.io/olasesi/viva-vtu/auth-service:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: auth-service-config
            - secretRef:
                name: auth-service-secrets
          command: ["sh", "-c", "npx prisma migrate deploy"]
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "300m"
              memory: "256Mi"
  backoffLimit: 3
  ttlSecondsAfterFinished: 600